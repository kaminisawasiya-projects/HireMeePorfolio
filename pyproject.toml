[project]
name = "hiremee"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "kamini sawasiya", email = "kaminisawasiya@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.142.4",
    "groq>=1.7.0",
    "pydantic>=2.13.5",
    "pypdf>=6.19.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
hiremee = "hiremee:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
